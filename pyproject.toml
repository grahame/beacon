[project]
name = "beacon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "black>=26.10.1",
    "fastapi-users[oauth,sqlalchemy]>=15.0.5",
    "mailgun>=1.9.1",
    "psycopg2>=2.9.13",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "ruff>=0.17.1",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
beacon = "beacon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beacon"]


[tool.ruff.lint]
# keep ruff's pre-0.17 default rule set
select = ["E4", "E7", "E9", "F"]
